name: Build Windows executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests cryptography psutil pyinstaller

      - name: Build executable
        run: |
          python -m py_compile zte_f6600p_export.py
          pyinstaller --onefile --console --clean --noconfirm --name ZTE-F6600P-Export zte_f6600p_export.py

      - name: Check executable starts
        run: .\dist\ZTE-F6600P-Export.exe --help

      - name: Upload executable to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" "dist/ZTE-F6600P-Export.exe" --repo "$env:GITHUB_REPOSITORY"
